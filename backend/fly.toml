# Fly.io settings for the backend. docs/DEPLOY.md walks through the deploy.
#
# One machine in Mumbai, always on, public HTTPS. Secrets (every value from
# backend/.env) are NOT in this file; they go in with `fly secrets import`.

# Change this once: Fly app names are global, so pick something unlikely to
# be taken, for example lg-maya-backend. Then `fly apps create <that name>`.
app = "lg-maya-backend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  APP_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  # Never scale to zero. A lead who submits the form while the machine is
  # waking up waits ten seconds and thinks the site is broken.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
